<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Food Ordering System</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand" href="#">🍔 Food Ordering System</a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#restaurantSection">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="#menuSection">Menu Items</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="alertBox"></div>

    <div class="row g-4">
      <!-- Left column: forms -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm mb-4" id="restaurantSection">
          <div class="card-header bg-danger text-white">Add Restaurant</div>
          <div class="card-body">
            <form id="restaurantForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="restName">Name</label>
                <input type="text" class="form-control" id="restName" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="restAddress">Address</label>
                <input type="text" class="form-control" id="restAddress" />
              </div>
              <button type="submit" class="btn btn-danger w-100">Add Restaurant</button>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-danger text-white">Add Menu Item</div>
          <div class="card-body">
            <form id="menuForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="restaurantSelect">Restaurant</label>
                <select class="form-select" id="restaurantSelect"></select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="itemName">Name</label>
                <input type="text" class="form-control" id="itemName" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="itemDescription">Description</label>
                <input type="text" class="form-control" id="itemDescription" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="itemPrice">Price</label>
                <input type="number" step="0.01" class="form-control" id="itemPrice" />
              </div>
              <button type="submit" class="btn btn-danger w-100">Add Menu Item</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Right column: table -->
      <div class="col-12 col-lg-8" id="menuSection">
        <h4>Menu Items</h4>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle bg-white shadow-sm">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Restaurant</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menuTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="script.js"></script>
</body>
</html>
